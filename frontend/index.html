<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Clone Detector</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Auth View -->
        <div id="auth-view" class="view">
            <div class="glass-panel auth-panel">
                <div class="brand">
                    <div class="logo"></div>
                    <h1>Sentinel<span class="highlight">AI</span></h1>
                    <p>Detect Voice Cloning Instantly</p>
                </div>
                
                <div class="tabs">
                    <button class="tab active" data-target="signin">Sign In</button>
                    <button class="tab" data-target="signup">Sign Up</button>
                </div>
                
                <form id="signin-form" class="auth-form active">
                    <div class="input-group">
                        <label for="signin-email">Email</label>
                        <input type="email" id="signin-email" required placeholder="user@example.com">
                    </div>
                    <div class="input-group">
                        <label for="signin-password">Password</label>
                        <input type="password" id="signin-password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn primary btn-glow">Access Dashboard</button>
                    <div class="error-msg" id="signin-error"></div>
                </form>

                <form id="signup-form" class="auth-form">
                    <div class="input-group">
                        <label for="signup-name">Full Name</label>
                        <input type="text" id="signup-name" required placeholder="John Doe">
                    </div>
                    <div class="input-group">
                        <label for="signup-email">Email</label>
                        <input type="email" id="signup-email" required placeholder="user@example.com">
                    </div>
                    <div class="input-group">
                        <label for="signup-password">Password</label>
                        <input type="password" id="signup-password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn primary btn-glow">Create Account</button>
                    <div class="error-msg" id="signup-error"></div>
                </form>
            </div>
        </div>

        <!-- Dashboard View -->
        <div id="dashboard-view" class="view hidden">
            <nav class="navbar glass-nav">
                <div class="brand-sm">Sentinel<span class="highlight">AI</span></div>
                <button id="logout-btn" class="btn secondary">Logout</button>
            </nav>
            
            <main class="dashboard-content">
                <div class="upload-section glass-panel">
                    <h2>Analyze Audio</h2>
                    <form id="analyze-form">
                        <div class="file-drop-area" id="file-drop">
                            <span class="upload-icon">🎙️</span>
                            <span class="file-msg">Drag & Drop or Click to Select Audio</span>
                            <input type="file" id="audio-file" accept=".wav,.mp3,.ogg,.webm,.flac,.m4a" required>
                        </div>
                        <div id="file-name-display" class="file-name hidden"></div>
                        
                        <div class="form-row">
                            <div class="input-group">
                                <label for="transaction-value">Transaction Value ($)</label>
                                <input type="number" id="transaction-value" value="0" min="0" step="0.01" required>
                            </div>
                            <div class="input-group checkbox-group">
                                <label class="cyber-checkbox">
                                    <input type="checkbox" id="known-contact">
                                    <span class="checkmark"></span>
                                    Known Contact
                                </label>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn primary btn-glow full-width" id="analyze-btn">
                            <span class="btn-text">Analyze Risk</span>
                            <div class="loader hidden"></div>
                        </button>
                        <div class="error-msg" id="analyze-error"></div>
                    </form>
                </div>

                <div class="results-section glass-panel hidden" id="results-panel">
                    <h2>Analysis Results</h2>
                    <div class="risk-score-card">
                        <div class="score-circle" id="score-circle">
                            <span id="risk-score-value">0</span>%
                        </div>
                        <div class="risk-details">
                            <h3 id="risk-level">Unknown</h3>
                            <p id="risk-recommendation">Awaiting analysis...</p>
                        </div>
                    </div>
                    
                    <div class="metrics-grid">
                        <div class="metric-card">
                            <span class="metric-label">Synthetic Voice Prob.</span>
                            <span class="metric-value" id="metric-synth">0%</span>
                        </div>
                        <div class="metric-card">
                            <span class="metric-label">Signal-to-Noise (SNR)</span>
                            <span class="metric-value" id="metric-snr">0 dB</span>
                        </div>
                        <div class="metric-card">
                            <span class="metric-label">Clipping</span>
                            <span class="metric-value" id="metric-clip">0%</span>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
